lesson_id: 22
questions:
  - type: multiple_choice
    question: "What does the regex anchor '$' match?"
    choices:
      - "A literal dollar sign character"
      - "The start of a line"
      - "The end of a line"
      - "Any single character"
    answer: 2
    explanation: "In regular expressions, the dollar sign ($) is an anchor that matches the end of a line. To match a literal dollar sign, you would need to escape it: \\$."

  - type: fill_in_blank
    question: "The grep flag to enable extended regular expressions (which allows +, ?, and | without backslashes) is ___."
    answer: "-E"
    accept: ["-E", "E", "--extended-regexp"]
    explanation: "The -E flag enables Extended Regular Expressions (ERE), allowing you to use +, ?, {}, |, and () without escaping them with backslashes."

  - type: true_false
    question: "In a regular expression, the pattern [^0-9] matches any digit character."
    answer: false
    explanation: "The caret (^) inside square brackets negates the character class. [^0-9] matches any character that is NOT a digit. Without the caret, [0-9] would match digits."

  - type: multiple_choice
    question: "Which pattern matches the strings 'color' and 'colour' but nothing else?"
    choices:
      - "grep -E 'col.*r'"
      - "grep -E 'colou?r'"
      - "grep -E 'colou+r'"
      - "grep -E 'colo[u]r'"
    answer: 1
    explanation: "The ? quantifier means 'zero or one' of the preceding character. So 'colou?r' matches 'color' (zero u's) and 'colour' (one u). The .* pattern would match too broadly, u+ requires at least one u, and [u] matches exactly one u."

  - type: multiple_choice
    question: "What does the extended regex pattern '[0-9]{2,4}' match?"
    choices:
      - "Exactly 2 or exactly 4 digits"
      - "A sequence of 2 to 4 consecutive digits"
      - "The literal string {2,4} after a digit"
      - "2 digits followed by 4 digits"
    answer: 1
    explanation: "The {n,m} quantifier matches between n and m repetitions of the preceding element. So [0-9]{2,4} matches 2, 3, or 4 consecutive digits."
