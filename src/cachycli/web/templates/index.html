<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CachyCLI</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-header-top">
                <div>
                    <h1>CachyCLI</h1>
                    <p>Learn Linux, one lesson a day</p>
                </div>
                <button class="sidebar-settings-btn" onclick="openSettings()" title="Settings">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    <span class="update-badge" id="sidebar-update-badge" style="display:none"></span>
                </button>
            </div>
        </div>
        <div class="sidebar-nav">
            <button id="nav-lessons" class="active" onclick="showLessons()">Lessons</button>
            <button id="nav-progress" onclick="showProgress()">Progress</button>
        </div>
        <div class="sidebar-content" id="sidebar-list"></div>
    </aside>

    <!-- Main content -->
    <main class="main">
        <div class="main-scroll" id="main-content">
            <div class="dashboard fade-in" id="view-dashboard"></div>
        </div>
    </main>
</div>

<script src="/static/js/marked.min.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
