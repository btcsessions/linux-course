<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Background with rounded corners -->
  <rect width="1024" height="1024" rx="228" ry="228" fill="#1d1d1f"/>

  <!-- Subtle gradient overlay -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d2d2f"/>
      <stop offset="100%" stop-color="#1d1d1f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0071e3" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#34c759" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="228" ry="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" ry="228" fill="url(#glow)"/>

  <!-- Terminal window frame -->
  <rect x="152" y="180" width="720" height="520" rx="16" ry="16" fill="#2d2d2f" stroke="#3d3d3f" stroke-width="2"/>

  <!-- Title bar -->
  <rect x="152" y="180" width="720" height="48" rx="16" ry="16" fill="#363638"/>
  <rect x="152" y="204" width="720" height="24" fill="#363638"/>

  <!-- Window dots -->
  <circle cx="192" cy="204" r="8" fill="#ff5f57"/>
  <circle cx="220" cy="204" r="8" fill="#febc2e"/>
  <circle cx="248" cy="204" r="8" fill="#28c840"/>

  <!-- Terminal prompt line 1: green prompt with command -->
  <text x="188" y="278" font-family="SF Mono, Menlo, monospace" font-size="28" font-weight="600" fill="#28c840">$</text>
  <text x="216" y="278" font-family="SF Mono, Menlo, monospace" font-size="28" fill="#f5f5f7">cachycli learn</text>

  <!-- Terminal output line 2 -->
  <text x="188" y="322" font-family="SF Mono, Menlo, monospace" font-size="24" fill="#86868b">Week 1 — Terminal &amp; Navigation</text>

  <!-- Terminal prompt line 3: active command -->
  <text x="188" y="374" font-family="SF Mono, Menlo, monospace" font-size="28" font-weight="600" fill="#28c840">$</text>
  <text x="216" y="374" font-family="SF Mono, Menlo, monospace" font-size="28" fill="#f5f5f7">ls -la</text>

  <!-- Terminal output lines -->
  <text x="188" y="414" font-family="SF Mono, Menlo, monospace" font-size="22" fill="#0071e3">drwxr-xr-x</text>
  <text x="380" y="414" font-family="SF Mono, Menlo, monospace" font-size="22" fill="#f5f5f7">Documents/</text>
  <text x="188" y="446" font-family="SF Mono, Menlo, monospace" font-size="22" fill="#0071e3">drwxr-xr-x</text>
  <text x="380" y="446" font-family="SF Mono, Menlo, monospace" font-size="22" fill="#f5f5f7">Projects/</text>
  <text x="188" y="478" font-family="SF Mono, Menlo, monospace" font-size="22" fill="#34c759">-rw-r--r--</text>
  <text x="380" y="478" font-family="SF Mono, Menlo, monospace" font-size="22" fill="#f5f5f7">hello.sh</text>

  <!-- Blinking cursor -->
  <text x="188" y="530" font-family="SF Mono, Menlo, monospace" font-size="28" font-weight="600" fill="#28c840">$</text>
  <rect x="216" y="514" width="14" height="24" rx="2" fill="#28c840" opacity="0.9"/>

  <!-- Progress bar at bottom -->
  <rect x="152" y="740" width="720" height="8" rx="4" fill="#2d2d2f"/>
  <rect x="152" y="740" width="206" height="8" rx="4" fill="#0071e3"/>

  <!-- Bottom text -->
  <text x="512" y="800" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="48" font-weight="700" fill="#f5f5f7" text-anchor="middle" letter-spacing="-1">CachyCLI</text>
  <text x="512" y="844" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="24" fill="#86868b" text-anchor="middle">Learn Linux</text>
</svg>
