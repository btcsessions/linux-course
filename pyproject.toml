[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cachycli"
version = "0.1.0"
description = "A terminal-based Linux CLI learning app for CachyOS"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0",
    "textual>=0.40",
    "click>=8.0",
    "pyyaml>=6.0",
    "python-frontmatter>=1.0",
]

[project.scripts]
cachycli = "cachycli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cachycli = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
